name: Build Meteo

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Extract source project
        shell: bash
        run: |
          set -euo pipefail
          unzip -q "Meteo-V2.0.1-Fabric-1.21.1.zip" -d build-source
          root=$(find build-source -mindepth 1 -maxdepth 1 -type d | head -n 1)
          sed -i "s/fabric-loom' version '1.9-SNAPSHOT/fabric-loom' version '1.9.2/" "$root/build.gradle"
          echo "METEO_ROOT=$root" >> "$GITHUB_ENV"
      - name: Build
        working-directory: ${{ env.METEO_ROOT }}
        run: gradle --no-daemon clean build
      - uses: actions/upload-artifact@v4
        with:
          name: meteo-2.0.1-fabric-1.21.1
          path: ${{ env.METEO_ROOT }}/build/libs/*.jar
          if-no-files-found: error
