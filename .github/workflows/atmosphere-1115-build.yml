name: Build Atmosphere 1.1.15

on:
  push:
    paths:
      - Atmosphere_1.1.15_Shelf_Cloud_Source.zip
      - .github/workflows/atmosphere-1115-build.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - run: unzip -q Atmosphere_1.1.15_Shelf_Cloud_Source.zip
      - name: Test restored tornado and shared gust-front geometry
        working-directory: atmosphere-java-1.1.15
        run: |
          javac -d build/model-test tools/stubs/dev/atmosphere/{AtmosphereSettings,ManualPressureSystems,StormEvents}.java tools/stubs/net/minecraft/{util/math/BlockPos,world/World}.java src/main/java/dev/atmosphere/{WeatherCells,StormEvolution,GustFront,ShelfCloudGeometry,TornadoGeometry,WeatherModel,WeatherTuning,SoftCloudMath,SynopticSystems}.java tools/{WeatherEvolutionSmokeTest,TornadoGeometryTest,GustFrontTest,ManualGustFrontTest,WeatherModelRevolutionTest}.java
          java -cp build/model-test WeatherEvolutionSmokeTest
          java -cp build/model-test TornadoGeometryTest
          java -cp build/model-test GustFrontTest
          java -cp build/model-test ManualGustFrontTest
          java -cp build/model-test WeatherModelRevolutionTest
      - run: gradle clean build --no-daemon --stacktrace
        working-directory: atmosphere-java-1.1.15
      - uses: actions/upload-artifact@v4
        with:
          name: atmosphere-1.1.15-jar
          path: atmosphere-java-1.1.15/build/libs/*.jar
