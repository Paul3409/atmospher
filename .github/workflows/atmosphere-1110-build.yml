name: Build Atmosphere 1.1.10

on:
  push:
    paths:
      - Atmosphere_1.1.10_Manual_Supercells_Source.zip
      - .github/workflows/atmosphere-1110-build.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - run: unzip -q Atmosphere_1.1.10_Manual_Supercells_Source.zip
      - run: gradle clean build --no-daemon --stacktrace
        working-directory: atmosphere-java-1.1.10
      - uses: actions/upload-artifact@v4
        with:
          name: atmosphere-1.1.10-jar
          path: atmosphere-java-1.1.10/build/libs/*.jar
