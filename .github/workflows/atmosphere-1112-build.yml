name: Build Atmosphere 1.1.12

on:
  push:
    paths:
      - Atmosphere_1.1.12_Tornado_Lifecycle_Source.zip
      - .github/workflows/atmosphere-1112-build.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - run: unzip -q Atmosphere_1.1.12_Tornado_Lifecycle_Source.zip
      - name: Test tornado lifecycle
        working-directory: atmosphere-java-1.1.12
        run: |
          javac -d build/model-test src/main/java/dev/atmosphere/WeatherCells.java src/main/java/dev/atmosphere/StormEvolution.java tools/WeatherEvolutionSmokeTest.java
          java -cp build/model-test WeatherEvolutionSmokeTest
      - run: gradle clean build --no-daemon --stacktrace
        working-directory: atmosphere-java-1.1.12
      - uses: actions/upload-artifact@v4
        with:
          name: atmosphere-1.1.12-jar
          path: atmosphere-java-1.1.12/build/libs/*.jar
