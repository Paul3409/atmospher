name: Build Atmosphere 1.1.14

on:
  push:
    paths:
      - Atmosphere_1.1.14_Tornado_Supercell_Source.zip
      - .github/workflows/atmosphere-1114-build.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - run: unzip -q Atmosphere_1.1.14_Tornado_Supercell_Source.zip
      - name: Test weather and tornado evolution
        working-directory: atmosphere-java-1.1.14
        run: |
          javac -d build/model-test src/main/java/dev/atmosphere/WeatherCells.java src/main/java/dev/atmosphere/StormEvolution.java src/main/java/dev/atmosphere/TornadoGeometry.java tools/WeatherEvolutionSmokeTest.java tools/TornadoGeometryTest.java
          java -cp build/model-test WeatherEvolutionSmokeTest
          java -cp build/model-test TornadoGeometryTest
      - run: gradle clean build --no-daemon --stacktrace
        working-directory: atmosphere-java-1.1.14
      - uses: actions/upload-artifact@v4
        with:
          name: atmosphere-1.1.14-jar
          path: atmosphere-java-1.1.14/build/libs/*.jar
