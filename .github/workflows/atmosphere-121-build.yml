name: Build Atmosphere 1.2.1

on:
  push:
    paths:
      - Atmosphere_1.2.1_Sirenenpegel_Probeplan_Source.zip
      - .github/workflows/atmosphere-121-build.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - run: unzip -q Atmosphere_1.2.1_Sirenenpegel_Probeplan_Source.zip
      - name: Test weather, alarm levels and probe schedule
        working-directory: atmosphere-java-1.2.1
        run: |
          javac -d build/model-test tools/stubs/dev/atmosphere/{AtmosphereSettings,ManualPressureSystems,StormEvents}.java tools/stubs/net/minecraft/{util/math/BlockPos,world/World}.java src/main/java/dev/atmosphere/{WeatherCells,StormEvolution,GustFront,ShelfCloudGeometry,TornadoGeometry,WeatherModel,WeatherTuning,SoftCloudMath,SynopticSystems,SupercellGeometry,SettingsStorage}.java src/main/java/dev/atmosphere/siren/{SirenProgram,SirenEngine,SirenGain}.java tools/{WeatherEvolutionSmokeTest,TornadoGeometryTest,GustFrontTest,ManualGustFrontTest,WeatherModelRevolutionTest,SupercellGeometryTest,SettingsStorageTest,SirenEngineTest,SirenScheduleTest}.java
          for test in WeatherEvolutionSmokeTest TornadoGeometryTest GustFrontTest ManualGustFrontTest WeatherModelRevolutionTest SupercellGeometryTest SettingsStorageTest SirenEngineTest SirenScheduleTest; do java -cp build/model-test "$test" || exit 1; done
      - run: gradle clean build --no-daemon --stacktrace
        working-directory: atmosphere-java-1.2.1
      - uses: actions/upload-artifact@v4
        with:
          name: atmosphere-1.2.1-jar
          path: atmosphere-java-1.2.1/build/libs/*.jar
