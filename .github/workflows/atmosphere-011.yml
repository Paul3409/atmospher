name: Atmosphere Weather Simulator 2.0.0
on:
  push:
    paths:
      - Atmosphere_NeoForge_0.1.1_Source.zip
      - .github/workflows/atmosphere-011.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - run: unzip -q Atmosphere_NeoForge_0.1.1_Source.zip
      - name: Build Minecraft 1.21.1 / NeoForge 21.1.259
        working-directory: atmosphere-neoforge-0.1.1
        run: gradle clean build --no-daemon --console=plain --stacktrace 2>&1 | tee build.log
      - name: Verify manual simulator package
        working-directory: atmosphere-neoforge-0.1.1
        run: |
          python - <<'PY'
          import pathlib,zipfile,tomllib
          jar=next(pathlib.Path('build/libs').glob('*.jar'))
          with zipfile.ZipFile(jar) as z:
              names=set(z.namelist())
              required={
                  'dev/atmosphere/companion/WeatherSimulatorScreen.class',
                  'dev/atmosphere/companion/WeatherMapScreen.class',
                  'dev/atmosphere/companion/ManualWeatherZone.class',
                  'dev/atmosphere/companion/WeatherZoneManager.class',
                  'dev/atmosphere/companion/DistanceFogController.class'
              }
              assert required <= names, required-names
              metadata=tomllib.loads(z.read('META-INF/neoforge.mods.toml').decode())
              deps={d['modId']:d['versionRange'] for d in metadata['dependencies']['atmosphere_companion']}
              assert deps=={'minecraft':'[1.21.1]','neoforge':'[21.1.259]'},deps
          print('PASS: manual zones, distance fog and exact NeoForge version packaged')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: atmosphere-weather-simulator-2.0.0
          path: atmosphere-neoforge-0.1.1/build/libs/atmosphere-companion-neoforge-2.0.0.jar
      - name: Publish downloadable package
        run: |
          zip -j Atmosphere_Weather_Simulator_2.0.0_NeoForge_21.1.259.zip \
            atmosphere-neoforge-0.1.1/build/libs/atmosphere-companion-neoforge-2.0.0.jar \
            atmosphere-neoforge-0.1.1/weather-simulator-math-preview.png \
            atmosphere-neoforge-0.1.1/README.md
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add Atmosphere_Weather_Simulator_2.0.0_NeoForge_21.1.259.zip
          git commit -m 'Package Atmosphere Weather Simulator 2.0.0 [skip ci]'
          git push
      - name: Preserve compiler diagnostics
        if: failure()
        run: |
          cp atmosphere-neoforge-0.1.1/build.log ci-build-error.log || true
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add ci-build-error.log
          git commit -m 'Record Weather Simulator compiler diagnostics [skip ci]' || true
          git push || true
