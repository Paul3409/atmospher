name: Atmosphere NeoForge 21.1.259
on:
  push:
    paths:
      - Atmosphere_NeoForge_0.1.1_Source.zip
      - .github/workflows/atmosphere-011.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-client:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - run: unzip -q Atmosphere_NeoForge_0.1.1_Source.zip
      - name: Build exact NeoForge version
        working-directory: atmosphere-neoforge-0.1.1
        run: gradle clean build --no-daemon --console=plain --stacktrace 2>&1 | tee build.log
      - name: Preserve compiler diagnostics
        if: failure()
        run: |
          cp atmosphere-neoforge-0.1.1/build.log ci-build-error.log
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add ci-build-error.log
          git commit -m 'Record Atmosphere compiler diagnostics [skip ci]'
          git push
      - name: Verify packaged versions and mixin
        working-directory: atmosphere-neoforge-0.1.1
        run: |
          python - <<'PY' 2>&1 | tee verify.log
          import zipfile,pathlib,tomllib,json
          p=next(pathlib.Path('build/libs').glob('*.jar'))
          with zipfile.ZipFile(p) as z:
              names=z.namelist()
              assert 'fabric.mod.json' not in names
              assert not any('NeoSmoke' in n for n in names)
              assert 'dev/atmosphere/companion/mixin/LevelRendererMixin.class' in names
              for asset in ['rain_streak.png','snow_flake.png','rain_light.ogg','rain_medium.ogg','rain_heavy.ogg','wind_forest.ogg','thunder_rumble.ogg']:
                  assert any(n.endswith(asset) for n in names),asset
              m=tomllib.loads(z.read('META-INF/neoforge.mods.toml').decode())
              deps={d['modId']:d['versionRange'] for d in m['dependencies']['atmosphere_companion']}
              assert deps=={'minecraft':'[1.21.1]','neoforge':'[21.1.259]'},deps
              assert m['mixins'][0]['config']=='atmosphere_companion.mixins.json'
          PY
      - name: Preserve package diagnostics
        if: failure()
        run: |
          cp atmosphere-neoforge-0.1.1/verify.log ci-verify-error.log
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add ci-verify-error.log
          git commit -m 'Record Atmosphere package diagnostics [skip ci]'
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: atmosphere-011-jar
          path: atmosphere-neoforge-0.1.1/build/libs/*.jar
      - name: Prepare isolated test world
        working-directory: atmosphere-neoforge-0.1.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libasound2t64
          python -m venv build/test-venv
          build/test-venv/bin/pip -q install nbtlib
          build/test-venv/bin/python tools/create_test_world.py
      - name: Test toggles in Minecraft 1.21.1 client
        working-directory: atmosphere-neoforge-0.1.1
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
          ALSOFT_DRIVERS: 'null'
        run: |
          xvfb-run -a -s '-screen 0 1280x720x24' timeout 420s gradle runClient -PsmokeTest --no-daemon --console=plain --stacktrace > neo-client.log 2>&1
          test -s run/screenshots/01-vanilla-an.png
          test -s run/screenshots/02-vanilla-aus.png
          for cloud in cumulus stratocumulus stratus nimbostratus cumulonimbus; do test -s "run/screenshots/$cloud.png"; done
          test -s run/screenshots/radar.png
          test -s run/screenshots/menu.png
          test -s run/screenshots/eigener-regen.png
          test -s run/screenshots/vorhang-ferne.png
          test -s run/screenshots/vorhang-nah.png
          test -s run/screenshots/riesen-cumulonimbus.png
          test -s run/screenshots/eigener-schnee.png
          test -s run/screenshots/cirrus.png
          test -s run/screenshots/menu-wetter.png
          test -s run/screenshots/menu-grafik.png
          test -s run/screenshots/nachtwolken.png
          test -s run/screenshots/natuerliche-wetterzelle.png
          test -s run/screenshots/menu-wetterzellen.png
          test -s run/screenshots/terrainnebel.png
          test -s run/screenshots/menu-nebel.png
          test -s run/screenshots/menu-partikel.png
          test -s run/screenshots/menu-sounds.png
          for marker in ATMOSPHERE_NEO_READY ATMOSPHERE_NEO_WORLD_READY ATMOSPHERE_TEST_WORLD_ANCHORED_WIND ATMOSPHERE_TEST_WIND_TURN_CONTINUITY ATMOSPHERE_TEST_DRY_CLOUD ATMOSPHERE_TEST_CLOUD_TILE_CONTINUITY ATMOSPHERE_TEST_CONTINUOUS_LAYER ATMOSPHERE_TEST_RAIN_FIELD ATMOSPHERE_TEST_CLOUD_LOCAL_RAIN ATMOSPHERE_TEST_OPTIONS_DISABLED ATMOSPHERE_TEST_HIDE_CLOUDS ATMOSPHERE_TEST_HIDE_PRECIPITATION ATMOSPHERE_TEST_HIDE_RAIN_EFFECTS ATMOSPHERE_TEST_OPTIONS_RESTORED ATMOSPHERE_TEST_TEMPERATURE_BOUNDARIES ATMOSPHERE_TEST_RADAR_DENSITY ATMOSPHERE_TEST_GIANT_STORM ATMOSPHERE_TEST_SNOW ATMOSPHERE_TEST_NATURAL_CELLS ATMOSPHERE_TEST_NON_CIRCULAR_RAIN ATMOSPHERE_TEST_TERRAIN_FOG ATMOSPHERE_TEST_TEXTURED_PRECIPITATION ATMOSPHERE_TEST_WEATHER_SOUNDS; do grep -q "$marker" neo-client.log; done
      - name: Preserve client diagnostics
        if: failure()
        run: |
          tail -n 1200 atmosphere-neoforge-0.1.1/neo-client.log > ci-client-error.log
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add ci-client-error.log
          git commit -m 'Record Atmosphere client diagnostics [skip ci]'
          git push
      - name: Publish verified Atmosphere 0.9.0 package
        run: |
          zip -j Atmosphere_0.9.0_NeoForge_21.1.259_mit_Bildern.zip \
            atmosphere-neoforge-0.1.1/build/libs/atmosphere-companion-neoforge-0.9.0.jar \
            atmosphere-neoforge-0.1.1/weather-cells-math-preview-0.7.0.png \
            atmosphere-neoforge-0.1.1/layer-front-math-preview-0.7.0.png \
            atmosphere-neoforge-0.1.1/terrain-fog-math-preview-0.8.0.png \
            atmosphere-neoforge-0.1.1/precipitation-particle-preview-0.9.0.png \
            atmosphere-neoforge-0.1.1/run/screenshots/stratus.png \
            atmosphere-neoforge-0.1.1/run/screenshots/nimbostratus.png \
            atmosphere-neoforge-0.1.1/run/screenshots/vorhang-ferne.png \
            atmosphere-neoforge-0.1.1/run/screenshots/natuerliche-wetterzelle.png \
            atmosphere-neoforge-0.1.1/run/screenshots/eigener-regen.png \
            atmosphere-neoforge-0.1.1/run/screenshots/eigener-schnee.png \
            atmosphere-neoforge-0.1.1/run/screenshots/terrainnebel.png \
            atmosphere-neoforge-0.1.1/run/screenshots/radar.png \
            atmosphere-neoforge-0.1.1/run/screenshots/menu-wetterzellen.png \
            atmosphere-neoforge-0.1.1/run/screenshots/menu-nebel.png \
            atmosphere-neoforge-0.1.1/run/screenshots/menu-partikel.png \
            atmosphere-neoforge-0.1.1/run/screenshots/menu-sounds.png \
            atmosphere-neoforge-0.1.1/README.md
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add Atmosphere_0.9.0_NeoForge_21.1.259_mit_Bildern.zip
          git commit -m 'Package Atmosphere 0.9.0 verified build [skip ci]'
          git push
      - name: Diagnostics and downloadable test files
        if: always()
        working-directory: atmosphere-neoforge-0.1.1
        run: |
          grep -E 'ATMOSPHERE_|IllegalStateException|ERROR|Exception' neo-client.log | tail -n 240 || true
          tail -n 100 neo-client.log || true
          python - <<'PY'
          import pathlib,base64
          for marker,folder in [('ATMOSPHERE_JAR',pathlib.Path('build/libs')),('ATMOSPHERE_IMAGE',pathlib.Path('run/screenshots'))]:
              for p in sorted(folder.glob('*'), key=lambda p: (p.name != 'vorhang-ferne.png', p.name)):
                  if p.suffix not in ('.jar','.png'): continue
                  if marker == 'ATMOSPHERE_IMAGE' and p.name not in {'stratus.png','nimbostratus.png','vorhang-ferne.png','riesen-cumulonimbus.png','cirrus.png','radar.png','menu-wetter.png','menu-grafik.png','nachtwolken.png','natuerliche-wetterzelle.png','menu-wetterzellen.png','eigener-regen.png','eigener-schnee.png','terrainnebel.png','menu-nebel.png','menu-partikel.png','menu-sounds.png'}: continue
                  data=base64.b64encode(p.read_bytes()).decode()
                  for i,start in enumerate(range(0,len(data),4096)):
                      print(f'{marker}:{p.name}:{i}:{data[start:start+4096]}')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atmosphere-011-test-evidence
          path: |
            atmosphere-neoforge-0.1.1/neo-client.log
            atmosphere-neoforge-0.1.1/run/screenshots/*.png
            atmosphere-neoforge-0.1.1/run/logs/latest.log
            atmosphere-neoforge-0.1.1/run/crash-reports/*.txt
# Recheck Atmosphere 0.3.0 client behavior
