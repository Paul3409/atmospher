name: Build Atmosphere 1.1.16

on:
  push:
    paths:
      - Atmosphere_1.1.16_Classical_Supercells_Source.zip
      - .github/workflows/atmosphere-1116-build.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - run: unzip -q Atmosphere_1.1.16_Classical_Supercells_Source.zip
      - name: Test weather, geometry and configuration preservation
        working-directory: atmosphere-java-1.1.16
        run: |
          javac -d build/model-test tools/stubs/dev/atmosphere/{AtmosphereSettings,ManualPressureSystems,StormEvents}.java tools/stubs/net/minecraft/{util/math/BlockPos,world/World}.java src/main/java/dev/atmosphere/{WeatherCells,StormEvolution,GustFront,ShelfCloudGeometry,TornadoGeometry,WeatherModel,WeatherTuning,SoftCloudMath,SynopticSystems,SupercellGeometry,SettingsStorage}.java tools/{WeatherEvolutionSmokeTest,TornadoGeometryTest,GustFrontTest,ManualGustFrontTest,WeatherModelRevolutionTest,SupercellGeometryTest,SettingsStorageTest}.java
          for test in WeatherEvolutionSmokeTest TornadoGeometryTest GustFrontTest ManualGustFrontTest WeatherModelRevolutionTest SupercellGeometryTest SettingsStorageTest; do java -cp build/model-test "$test" || exit 1; done
      - run: gradle clean build --no-daemon --stacktrace
        working-directory: atmosphere-java-1.1.16
      - uses: actions/upload-artifact@v4
        with:
          name: atmosphere-1.1.16-jar
          path: atmosphere-java-1.1.16/build/libs/*.jar
